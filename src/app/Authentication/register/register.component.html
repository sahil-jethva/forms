<p-card class="flex justify-content-center mt-4" [style]="{width:'25rem','background-color':'#f2f2f2'}">
  <form [formGroup]="Registation" (ngSubmit)="register()">
    <div class="grid">
      <div class="col-12 flex justify-content-center align-items-center flex-column gap-4">
        <h2 class="font-semibold">Welcome to registration!</h2>
        <div class="flex gap-2">
          <label class="flex justify-content-center align-items-center" for="username">Username</label>
          <input pInputText id="username" type="text" formControlName="name" />
        </div>
        <div class="flex gap-5">
          <label class="flex justify-content-center align-items-center" for="username">Email</label>
          <input pInputText id="Email" type="text" formControlName="email" />
        </div>
        <div class="flex gap-2">
          <label class="flex justify-content-center align-items-center" for="password">Password</label>
          <input pInputText id="password" type="password" formControlName="password" />
        </div>
        <div class="flex">
          <p-toast />
          <p-button label="Register" type="submit" [disabled]="Registation.invalid" icon="pi pi-user" class="w-full" />
        </div>
        <p>
          Already have an account?<a routerLink="/login">Log In</a>
        </p>
      </div>
    </div>
  </form>
</p-card>
